spring.application.name=myShopping
spring.config.import=optional:file:.env[.properties],optional:file:myShopping/.env[.properties]

# TiDB Cloud credentials are supplied through .env locally or environment variables in deployment.
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/products?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.expiration-ms=900000
app.jwt.secret=${JWT_SECRET}